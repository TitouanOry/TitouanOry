# Déploiement Netlify : le site vit dans le dossier portfolio/
[build]
  base = "portfolio"
  command = "npm run build"
  publish = "dist"

# Application monopage : toutes les routes renvoient vers index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
